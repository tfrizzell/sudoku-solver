[project]
name = "sudoku-solver"
version = "0.1.0"
description = "A simple python Sudoku solver"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pylint>=3.3.6",
]

[tool.pylint.main]
ignore-paths = [
    "^.venv/.*",
]

recursive = "yes"

[tool.pylint.format]
max-line-length = 120
